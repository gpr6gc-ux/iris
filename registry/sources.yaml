# Narrative sources for the momentum watch. The tweets in the screenshot (Wall St Engine,
# Unusual Whales) arrive via TweetShift relaying X accounts into a Discord channel — so the
# capture is Discord, not the X API ($200/mo Basic, write-mostly free tier). You run your own
# TweetShift in your own server following these accounts; IRIS reads that channel.
#
# Rule: a source is here for speed and reach, not accuracy. Every tweet is a CLAIM until price
# and flow confirm it. The scorer never trusts text alone.

x_accounts:            # relayed by TweetShift into #momentum-feed
  fast_headlines:
    - wallstengine       # in the screenshot
    - unusual_whales     # in the screenshot
    - DeItaone           # Walter Bloomberg — fastest general headlines
    - FirstSquawk
    - StockMKTNewz
  ai_specific:
    - rowancheung
    - kimmonismus
    - TheTranscript_     # earnings-call quotes
  macro_geo:
    - LiveSquawk
    - zerohedge          # fast, biased; weight accordingly

free_official:         # already wired in IRIS; permit automated access
  - EDGAR 8-K            # Market: Filings Radar, hourly
  - FRED                 # Market: Macro Daily
  - HN                   # Scout: Signals — re-point its keywords at the universe

discord:
  server: your own       # not a community you are a member of — a bot needs to be invited
  channel: momentum-feed
  capture: gateway listener in sidecar/ (persistent websocket), NOT a 60-second poll

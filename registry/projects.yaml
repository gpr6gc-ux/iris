# Every project IRIS knows about. This file is the source of truth; CI syncs it into
# iris.projects, and the command center renders one tile per entry with live health.
#
# Adding a project here is how it appears in the UI. There is no other list.
#
#   status: live | prototype | dormant | retiring
#   repo:   owner/name on GitHub, or null when the project has no code of its own
#   schemas: the Postgres schemas it owns in the iris project
#
# Rule: a project owns its schemas. Two projects sharing a schema means one of them is
# really a feature of the other — merge them rather than listing both.

projects:
  - key: command
    name: IRIS Command
    status: live
    summary: The front door. Renders this registry and links out to everything else.
    repo: gpr6gc-ux/iris-command        # pending — see docs/WORKING.md
    site: https://iris-command-5.netlify.app
    schemas: [brain, iris, ops]
    owns_agents: [reviewer, adversary, librarian]

  - key: investing
    name: Investing & Markets
    status: live
    summary: Deterministic decision support over prices, filings and options positioning.
    repo: gpr6gc-ux/iris-investing
    site: https://iris-investing.netlify.app
    schemas: [inv, market]
    owns_agents: [analyst-invest, earnings-actuals]

  - key: modellens
    name: ModelLens
    status: live
    summary: Anaplan model intelligence — review, ask, raw tasks over model metadata.
    repo: gpr6gc-ux/modellens
    site: https://modellens.netlify.app
    schemas: []
    owns_agents: [modellens-review]

  - key: karta
    name: Karta Memory
    status: prototype
    summary: Governed project memory. 45 tables exist; all 9 n8n workflows are draft skeletons.
    repo: null
    site: null
    schemas: [karta]
    owns_agents: []
    note: Largest schema in the database (45 tables) with no live workflow behind it.

  - key: estate
    name: Real Estate
    status: prototype
    summary: For-sale and distressed inventory, underwritten for cashflow on read.
    repo: null
    site: null
    schemas: [re]
    owns_agents: []

  - key: money
    name: Money
    status: prototype
    summary: Personal finance. Owner-only; never rendered in a public asset.
    repo: null
    site: null
    schemas: [fin]
    owns_agents: []

  - key: mccourtai
    name: McCourtAI
    status: live
    summary: The automation practice — marketing site and client-facing work.
    repo: gpr6gc-ux/mccourtai
    site: https://mccourtai.netlify.app
    schemas: [clients]
    owns_agents: [prospecting-scout]

  - key: rcm
    name: Healthcare RCM demos
    status: retiring
    summary: July 2026 pitch demos on synthetic data. See audit/RETIREMENT.md §5.
    repo: null
    site: null
    schemas: [rcm, fhir, phi]
    owns_agents: [rcm-worker, appeals-writer]

  - key: revenue
    name: Revenue Engine
    status: dormant
    summary: Content lanes with per-channel publish switches, all currently off.
    repo: null
    site: null
    schemas: [rev]
    owns_agents: [revenue-engine]

  - key: keplr
    name: Keplr
    status: dormant
    summary: Client tooling. Three Netlify sites, one Supabase project (INACTIVE).
    repo: gpr6gc-ux/keplr-tracker
    site: https://keplrtools.netlify.app
    schemas: []
    owns_agents: []

  - key: sightline
    name: Sightline
    status: dormant
    repo: gpr6gc-ux/sightline
    site: https://sightline-ar-demo.netlify.app
    schemas: []
    owns_agents: []

# Hosting that belongs to no project. Netlify currently carries 15 auto-named sites
# (tourmaline-marigold, frolicking-youtiao, reliable-moxie, fancy-cassata, merry-brigadeiros,
# heartfelt-crisp, delicate-pie, quiet-cobbler, jazzy-cactus, famous-concha,
# euphonious-mooncake, deft-mousse, teal-travesseiro, luxury-dodol, statuesque-stroopwafel).
# Each is a one-off deploy nobody named. They cost nothing but they are half the site list.
unclaimed_sites: 15

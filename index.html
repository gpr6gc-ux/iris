<!doctype html>
<html lang="en" data-theme="lens" data-mode="dark" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IRIS Command 5.0</title>
<meta name="description" content="IRIS Command 5.0 — the owner's agentic operating-system console. Agents draft, you decide, everything audited.">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0b0f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6fcfc" media="(prefers-color-scheme: light)">
<script>
  // Theme boot before first paint: no flash of the wrong mode. Same keys the app writes (iris.theme / iris.mode / prefs).
  (function () {
    try {
      var r = document.documentElement;
      var t = localStorage.getItem('iris.theme') || 'lens';
      var m = localStorage.getItem('iris.mode') || 'dark';
      var p = {}; try { p = JSON.parse(localStorage.getItem('iris.prefs') || '{}') || {}; } catch (e) {}
      r.setAttribute('data-theme', t);
      if (m === 'system') { r.removeAttribute('data-mode'); r.classList.add('mode-system'); }
      else { r.setAttribute('data-mode', m); r.classList.remove('mode-system'); }
      if (p.density) r.setAttribute('data-density', p.density);
    } catch (e) {}
  })();
</script>
